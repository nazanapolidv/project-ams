<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuevo Pedido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary bg-opacity-10">
  <div class="container text-center mt-5">
    <h2>Nuevo Pedido</h2>
    <p class="lead">Selecciona los productos para tu pedido:</p>

    <form method="POST" action="{{ url_for('nuevo_pedido') }}">
      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>SKU</th>
            <th>Producto</th>
            <th>Precio Unitario</th>
            <th>Cantidad</th>
          </tr>
        </thead>
        <tbody>
          {% for producto in productos %}
            <tr>
              <td>{{ producto.sku }}</td>
              <td>{{ producto.nombre }}</td>
              <td>${{ '%.2f'|format(producto.precio_unitario or 0) }}</td>
              <td><input type="number" min="0" name="cantidad_{{ producto.sku }}" class="form-control" value="0"></td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
      <button type="submit" class="btn btn-success">Crear Pedido</button>
      <a href="{{ url_for('cliente') }}" class="btn btn-secondary">Volver</a>
    </form>
  </div>
</body>
</html>
