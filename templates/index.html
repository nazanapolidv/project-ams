<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barc.co</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light p-4">
    <div>
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Barc.co Logo" width="150">
    </div>
    <h1>Depósito Principal</h1>
    <form action="/deposito-principal" method="post">
        <label for="nombre">Nombre del depósito principal</label>
        <input type="text" id="nombre" name="nombre" class="form-control" minlength="3" required>
        <br>
        <label for="contenedores">Cantidad de contenedores</label>
        <input type="number" id="contenedores" name="contenedores" class="form-control" min="1" required>
        <br>
        <button type="submit" class="btn btn-primary">Confirmar</button>
    </form>
</body>

</html>
